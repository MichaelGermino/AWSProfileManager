[package]
name = "gpui-shell-spike"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-component = "=0.9.1"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12" }
tray-icon = "0.21"
anyhow = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

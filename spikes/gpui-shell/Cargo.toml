[package]
name = "gpui-shell-spike"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-component = "=0.9.1"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12" }
tray-icon = "0.21"
anyhow = "1"
alacritty_terminal = "=0.26.0"
portable-pty = "0.9"
futures = "0.3"
wry = "=0.57.2"
image = "0.25"
smallvec = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Foundation"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

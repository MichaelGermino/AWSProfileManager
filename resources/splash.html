<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AWS Profile Manager</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #141415;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    /* The splash is a frameless window (frame: false in createSplash), so there is no OS title
       bar to grab. Without an explicit drag region it cannot be moved at all. The whole surface
       is draggable because nothing here is clickable. */
    body {
      -webkit-app-region: drag;
      -webkit-user-select: none;
      user-select: none;
      cursor: default;
    }
    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .icon-wrap img {
      display: block;
      width: 72px;
      height: auto;
      object-fit: contain;
    }
    .splash-message {
      color: #a1a1a6;
      font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
      font-size: 13px;
    }
    /* A quiet indeterminate bar rather than a pulsing icon. Colours follow theme.css; the window
       follows Settings → Appearance → Theme through nativeTheme.themeSource. */
    .bar { width: 96px; height: 2px; border-radius: 1px; background: #2a2a2d; overflow: hidden; }
    .bar::after {
      content: '';
      display: block;
      width: 32px;
      height: 100%;
      background: #3fb3a6;
      animation: splash-slide 1.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes splash-slide { from { transform: translateX(-32px); } to { transform: translateX(96px); } }
    @media (prefers-color-scheme: light) {
      html, body { background: #fafafa; }
      .splash-message { color: #525252; }
      .bar { background: #e5e5e7; }
      .bar::after { background: #0f766e; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bar::after { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="splash-content">
    <div class="icon-wrap">
      <img src="icon.png" alt="" />
    </div>
    <div class="bar" aria-hidden="true"></div>
    <p class="splash-message">Starting</p>
  </div>
  <script>
    // main passes the selected app icon (Settings → Appearance) as ?icon=<path relative to resources/>.
    // Only plain relative paths are accepted; anything else keeps the default icon.png.
    const icon = new URLSearchParams(location.search).get('icon');
    if (icon && /^[\w./-]+\.png$/.test(icon) && !icon.includes('..')) {
      document.querySelector('.icon-wrap img').src = icon;
    }
  </script>
</body>
</html>

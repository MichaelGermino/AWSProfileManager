[workspace]
resolver = "2"
members = ["crates/apm-core"]

[workspace.package]
version = "2.0.0-alpha.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
aes-gcm = "0.10"
pbkdf2 = "0.12"
rand = "0.8"
roxmltree = "0.20"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace]
resolver = "2"
members = ["crates/apm-core", "crates/apm-ui", "crates/apm-app", "tools/apm-release"]

[workspace.package]
version = "2.0.0-beta.1"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
aes-gcm = "0.10"
pbkdf2 = "0.12"
rand = "0.8"
roxmltree = "0.20"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12" }
gpui-component = "=0.9.1"
futures = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# Not "abort" (plan §4 item 7 asked for it): the app relies on unwinding to contain a panic to the
# piece of work that hit it. tokio catches a panic in a spawned task (scheduler refreshes, SSO
# polling, updater checks, terminal readers) and the rest of the app keeps running; under "abort"
# any such bug would kill the tray app and its background refresh. GPUI itself does not need it
# (its catch_unwind uses are in tests only). Costs about 10% of the exe size.
panic = "unwind"

# Day-to-day app builds: optimised (GPUI's unoptimised debug build stalls) but fast to link.
# cargo build -p apm-app --profile fastrel
[profile.fastrel]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 1
strip = false
panic = "unwind"

[package]
name = "apm-core"
description = "AWS Profile Manager behaviour: storage, crypto, credentials file, auth, scheduler. No UI."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
aes-gcm.workspace = true
pbkdf2.workspace = true
rand.workspace = true
roxmltree.workspace = true
chrono.workspace = true
thiserror.workspace = true
uuid = { version = "1", features = ["v4"] }
chrono-tz = { version = "0.10", default-features = false }
ryu-js = "1"
keyring = { version = "3", features = ["windows-native", "apple-native"] }

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "cookies", "json", "stream", "gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "net"] }
futures-util = "0.3"
scraper = "0.22"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }

[package]
name = "apm-app"
description = "AWS Profile Manager 2.0: main(), tray, windows; wires apm-core to apm-ui."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "aws-profile-manager"
path = "src/main.rs"

[features]
# APM_TEST_MODE seams for the UI test suite. Release packages build with --no-default-features.
default = ["test-hooks"]
test-hooks = []

[dependencies]
apm-core = { path = "../apm-core" }
apm-ui = { path = "../apm-ui" }
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
serde_json.workspace = true
futures.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tray-icon = "0.21"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
open = "5"
rfd = "0.15"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
# Embedded sign-in and console windows (WebView2), alive only while such a window is open.
wry = { version = "=0.57.2", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
# COM shell links (shortcut icons); same version and features gpui already builds.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
regex.workspace = true
chrono.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }

[target.'cfg(windows)'.dev-dependencies]
uiautomation = "0.25.1"

[[test]]
name = "flows"
path = "tests/flows.rs"
harness = true

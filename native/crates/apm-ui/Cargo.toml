[package]
name = "apm-ui"
description = "AWS Profile Manager 2.0 views (GPUI). All behaviour lives in apm-core."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
apm-core = { path = "../apm-core" }
gpui.workspace = true
gpui-component.workspace = true
gpui-kit-assets = "=0.9.1"
uuid = { version = "1", features = ["v4"] }
serde_json.workspace = true
base64.workspace = true
chrono.workspace = true
futures.workspace = true
anyhow = "1"
tokio = { version = "1", features = ["rt"] }
# VT parsing and the screen grid of the embedded terminal (Apache-2.0); we draw it ourselves.
alacritty_terminal = { version = "=0.26.0", default-features = false }

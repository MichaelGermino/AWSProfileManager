[package]
name = "apm-ui"
description = "AWS Profile Manager 2.0 views (GPUI). All behaviour lives in apm-core."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
apm-core = { path = "../apm-core" }
gpui.workspace = true
gpui-component.workspace = true
gpui-kit-assets = "=0.9.1"
# Re-reading the OS reduced-motion setting (gpui-component reads it once, at start-up).
gpui-base = "=0.9.1"
uuid = { version = "1", features = ["v4"] }
serde_json.workspace = true
base64.workspace = true
chrono.workspace = true
futures.workspace = true
anyhow = "1"
tokio = { version = "1", features = ["rt"] }
# VT parsing and the screen grid of the embedded terminal (Apache-2.0); we draw it ourselves.
alacritty_terminal = { version = "=0.26.0", default-features = false }
# Video frames handed to GPUI (`RenderImage` takes `image::Frame`s); same versions gpui uses.
image = { version = "0.25", default-features = false, features = ["png"] }
smallvec = "1"
# Round caps on the expiry ring's arc (the stroke options GPUI's PathBuilder takes); same version gpui uses.
lyon_tessellation = "=1.0.23"

[target.'cfg(windows)'.dependencies]
# Background video: Media Foundation decode (+ an optional D3D11 device for hardware decode).
# Same windows crate version gpui builds.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
